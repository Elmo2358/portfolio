<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 角丸の背景 -->
  <rect x="0" y="0" width="16" height="16" rx="3.2" fill="url(#grad)"/>

  <!-- 家のアイコン -->
  <g transform="translate(8, 8)">
    <!-- 屋根 -->
    <path d="M 0 -3.125 L -3.75 0 L 3.75 0 Z" fill="white"/>

    <!-- 本体 -->
    <rect x="-2.5" y="0" width="5" height="3.75" fill="white"/>

    <!-- ドア -->
    <rect x="-0.75" y="1.25" width="1.5" height="2.5" fill="#10b981"/>

    <!-- 窓 -->
    <rect x="-1.875" y="1" width="1" height="1" fill="white"/>
    <rect x="0.875" y="1" width="1" height="1" fill="white"/>
  </g>
</svg>