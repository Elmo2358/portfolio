<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 角丸の背景 -->
  <rect x="0" y="0" width="128" height="128" rx="25.6" fill="url(#grad)"/>

  <!-- 家のアイコン -->
  <g transform="translate(64, 64)">
    <!-- 屋根 -->
    <path d="M 0 -25 L -30 0 L 30 0 Z" fill="white"/>

    <!-- 本体 -->
    <rect x="-20" y="0" width="40" height="30" fill="white"/>

    <!-- ドア -->
    <rect x="-6" y="10" width="12" height="20" fill="#10b981"/>

    <!-- 窓 -->
    <rect x="-15" y="8" width="8" height="8" fill="white"/>
    <rect x="7" y="8" width="8" height="8" fill="white"/>
  </g>
</svg>