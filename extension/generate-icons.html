<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイコン生成ツール</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #10b981;
    }
    .canvas-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .canvas-item {
      text-align: center;
    }
    canvas {
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      margin: 10px 0;
    }
    button {
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #059669;
    }
    .download-btn {
      background: #3b82f6;
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
    }
    .download-btn:hover {
      background: #2563eb;
    }
    .info {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #10b981;
    }
  </style>
</head>
<body>
  <h1>🎨 Chrome拡張機能 アイコン生成ツール</h1>

  <div class="info">
    <strong>使い方:</strong>
    <ol>
      <li>「アイコンを生成」ボタンをクリック</li>
      <li>各サイズの「ダウンロード」ボタンをクリックして保存</li>
      <li>保存したファイルを `extension/icons/` ディレクトリに配置</li>
      <li>ファイル名を確認: icon16.png, icon48.png, icon128.png</li>
    </ol>
  </div>

  <button onclick="generateIcons()">✨ アイコンを生成</button>

  <div class="canvas-container">
    <div class="canvas-item">
      <canvas id="canvas16" width="16" height="16"></canvas>
      <br>
      <button class="download-btn" onclick="downloadIcon('canvas16', 'icon16.png')">
        ⬇️ icon16.png
      </button>
    </div>

    <div class="canvas-item">
      <canvas id="canvas48" width="48" height="48"></canvas>
      <br>
      <button class="download-btn" onclick="downloadIcon('canvas48', 'icon48.png')">
        ⬇️ icon48.png
      </button>
    </div>

    <div class="canvas-item">
      <canvas id="canvas128" width="128" height="128"></canvas>
      <br>
      <button class="download-btn" onclick="downloadIcon('canvas128', 'icon128.png')">
        ⬇️ icon128.png
      </button>
    </div>
  </div>

  <script>
    function generateIcons() {
      // 16x16
      drawIcon('canvas16', 16, 12);
      // 48x48
      drawIcon('canvas48', 48, 32);
      // 128x128
      drawIcon('canvas128', 128, 80);
    }

    function drawIcon(canvasId, size, fontSize) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // 背景グラデーション
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#10b981');
      gradient.addColorStop(1, '#059669');

      // 角丸の背景を描画
      const radius = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();

      ctx.fillStyle = gradient;
      ctx.fill();

      // 家のアイコンを描画
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 簡易的な家のアイコン
      const centerX = size / 2;
      const centerY = size / 2;
      const scale = size / 128;

      // 屋根
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - 25 * scale);
      ctx.lineTo(centerX - 30 * scale, centerY);
      ctx.lineTo(centerX + 30 * scale, centerY);
      ctx.closePath();
      ctx.fill();

      // 本体
      ctx.fillRect(centerX - 20 * scale, centerY, 40 * scale, 30 * scale);

      // ドア
      ctx.fillStyle = '#10b981';
      ctx.fillRect(centerX - 6 * scale, centerY + 10 * scale, 12 * scale, 20 * scale);

      // 窓
      ctx.fillStyle = 'white';
      ctx.fillRect(centerX - 15 * scale, centerY + 8 * scale, 8 * scale, 8 * scale);
      ctx.fillRect(centerX + 7 * scale, centerY + 8 * scale, 8 * scale, 8 * scale);
    }

    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const url = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      link.click();
    }

    // ページ読み込み時に自動生成
    window.onload = generateIcons;
  </script>
</body>
</html>
